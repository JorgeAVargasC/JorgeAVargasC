<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="QR Code — a scanner revealing the code" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.drA{animation:drA 26s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drC{animation:drC 32s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cont{animation:cont 40s linear infinite}
@keyframes drA{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(14%,10%) scale(1.15)}70%{transform:translate(4%,22%) scale(.95)}}
@keyframes drC{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-14%,-12%) scale(.92)}75%{transform:translate(-4%,-22%) scale(1.1)}}
@keyframes cont{to{transform:translate(-300px,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.t{transform-box:fill-box;transform-origin:center}
.view{transform-box:fill-box;transform-origin:center;animation:view 1.6s ease-in-out infinite}@keyframes view{50%{transform:scale(.96)}}
.laser{animation:laser 4.5s linear infinite}@keyframes laser{0%{transform:translateY(14px);opacity:1}50%{transform:translateY(86px);opacity:1}55%,100%{transform:translateY(86px);opacity:0}}
.r0{animation:k0 4.5s linear infinite}@keyframes k0{0%,2.8%{opacity:0}3.3%,85%{opacity:1}90%,100%{opacity:0}}.r1{animation:k1 4.5s linear infinite}@keyframes k1{0%,8.3%{opacity:0}8.8%,85%{opacity:1}90%,100%{opacity:0}}.r2{animation:k2 4.5s linear infinite}@keyframes k2{0%,13.9%{opacity:0}14.4%,85%{opacity:1}90%,100%{opacity:0}}.r3{animation:k3 4.5s linear infinite}@keyframes k3{0%,19.4%{opacity:0}19.9%,85%{opacity:1}90%,100%{opacity:0}}.r4{animation:k4 4.5s linear infinite}@keyframes k4{0%,25.0%{opacity:0}25.5%,85%{opacity:1}90%,100%{opacity:0}}.r5{animation:k5 4.5s linear infinite}@keyframes k5{0%,30.6%{opacity:0}31.1%,85%{opacity:1}90%,100%{opacity:0}}.r6{animation:k6 4.5s linear infinite}@keyframes k6{0%,36.1%{opacity:0}36.6%,85%{opacity:1}90%,100%{opacity:0}}.r7{animation:k7 4.5s linear infinite}@keyframes k7{0%,41.7%{opacity:0}42.2%,85%{opacity:1}90%,100%{opacity:0}}.r8{animation:k8 4.5s linear infinite}@keyframes k8{0%,47.2%{opacity:0}47.7%,85%{opacity:1}90%,100%{opacity:0}}
.m{opacity:0}</style>
