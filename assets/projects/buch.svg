<path class="s" d="M18 56H82M26 56V61Q26 63 28 63Q30 63 30 61V56M56 56V64Q56 66 58 66Q60 66 60 64V56M70 56V60Q70 62 72 62Q74 62 74 60V56" stroke="#EDEDE8" stroke-width="1.4"/>
<path class="s" d="M50 56V36" stroke="#EDEDE8" stroke-width="3"/>
<circle class="t halo" cx="50" cy="26" r="12" fill="#C6F24E" fill-opacity=".18"/>
<path class="flame" d="M50 18C46 23 46 29 50 31C54 29 54 23 50 18Z" stroke="#C6F24E" stroke-width="1.4" fill="#C6F24E" fill-opacity=".18"/>
<path class="s smoke k1" d="M48 14C44 10 52 6 48 0" stroke="#47474f" stroke-width="1.2" pathLength="1"/>
<path class="s smoke k2" d="M52 14C56 10 48 6 52 0" stroke="#47474f" stroke-width="1.2" pathLength="1"/>
<path class="s spr q0" d="M26 0V4" stroke="#EDEDE8" stroke-width="1.6"/><path class="s spr q1" d="M38 0V4" stroke="#C6F24E" stroke-width="1.6"/><path class="s spr q2" d="M64 0V4" stroke="#EDEDE8" stroke-width="1.6"/><path class="s spr q3" d="M74 0V4" stroke="#C6F24E" stroke-width="1.6"/><path class="s spr q4" d="M33 0V4" stroke="#EDEDE8" stroke-width="1.6"/><path class="s spr q5" d="M68 0V4" stroke="#C6F24E" stroke-width="1.6"/></g>
</g>
