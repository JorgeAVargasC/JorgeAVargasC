<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="Buch — a layered cake with a candle" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.drA{animation:drA 26s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drC{animation:drC 32s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cont{animation:cont 40s linear infinite}
@keyframes drA{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(14%,10%) scale(1.15)}70%{transform:translate(4%,22%) scale(.95)}}
@keyframes drC{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-14%,-12%) scale(.92)}75%{transform:translate(-4%,-22%) scale(1.1)}}
@keyframes cont{to{transform:translate(-300px,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.t{transform-box:fill-box;transform-origin:center}
.halo{animation:halo 1.4s ease-in-out infinite}@keyframes halo{50%{transform:scale(1.25);opacity:.6}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame 1.1s ease-in-out infinite}
@keyframes flame{25%{transform:scale(.9,1.3) rotate(-7deg)}50%{transform:scale(1.05,.9) rotate(5deg)}75%{transform:scale(.92,1.2) rotate(-3deg)}}
.smoke{stroke-dasharray:1;animation:smoke 2.2s ease-out infinite}.k2{animation-delay:1.1s}
@keyframes smoke{0%{stroke-dashoffset:1;opacity:0;transform:translateY(0)}40%{opacity:.9}100%{stroke-dashoffset:0;opacity:0;transform:translateY(-8px)}}
.spr{opacity:0;animation:spr 2.2s ease-in infinite;transform-box:fill-box;transform-origin:center}
.q1{animation-delay:.5s}.q2{animation-delay:.25s}.q3{animation-delay:.8s}.q4{animation-delay:1.1s}.q5{animation-delay:1.4s}
@keyframes spr{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}70%{opacity:1;transform:translateY(50px) rotate(160deg)}72%,100%{opacity:0;transform:translateY(50px) rotate(160deg)}}</style>
<clipPath id="cc"><rect width="600" height="375" rx="14"/></clipPath>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".08"/></pattern>
<radialGradient id="dm" cx=".5" cy=".5" r=".55"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="dmask"><rect width="600" height="375" fill="url(#dm)"/></mask>
<radialGradient id="glow" cx=".5" cy=".6" r=".5"><stop offset="0" stop-color="#C6F24E" stop-opacity=".12"/><stop offset="1" stop-color="#C6F24E" stop-opacity="0"/></radialGradient>
<g clip-path="url(#cc)">
<rect width="600" height="375" fill="#151518"/>
<rect width="600" height="375" fill="url(#dots)" mask="url(#dmask)"/>
<rect width="600" height="375" fill="url(#glow)"/>
<g transform="translate(160 47.5) scale(2.8)">
<path class="s" d="M8 88H92" stroke="#47474f" stroke-width="1.4"/>
<path class="s" d="M20 86V56H80V86" stroke="#EDEDE8" stroke-width="1.6"/>
