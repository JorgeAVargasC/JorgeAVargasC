<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="Brysa — a cocktail being poured" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.drA{animation:drA 26s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drC{animation:drC 32s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cont{animation:cont 40s linear infinite}
@keyframes drA{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(14%,10%) scale(1.15)}70%{transform:translate(4%,22%) scale(.95)}}
@keyframes drC{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-14%,-12%) scale(.92)}75%{transform:translate(-4%,-22%) scale(1.1)}}
@keyframes cont{to{transform:translate(-300px,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.s{fill:none;stroke-linecap:round;stroke-linejoin:round}
.t{transform-box:fill-box;transform-origin:center}
.pour{animation:pour 5s infinite}.liq{animation:liq 5s ease-in-out infinite}.wave{animation:wave 1.4s linear infinite}
@keyframes pour{0%,55%,100%{opacity:0}8%,48%{opacity:1}}
@keyframes liq{0%,10%,100%{transform:translateY(36px)}50%,85%{transform:translateY(6px)}}
@keyframes wave{to{transform:translateX(40px)}}
.bub{animation:bub 1.8s ease-out infinite}.b2{animation-delay:.6s}.b3{animation-delay:1.2s}
@keyframes bub{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.olive{animation:olive 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top right}@keyframes olive{50%{transform:translateY(3px) rotate(4deg)}}
.sp{transform:scale(0);animation:sp 2.8s infinite}.sp2{animation-delay:.7s}.sp3{animation-delay:1.4s}
@keyframes sp{0%{transform:scale(0) rotate(0)}30%{transform:scale(1) rotate(45deg)}60%,100%{transform:scale(0) rotate(90deg)}}</style>
<clipPath id="cc"><rect width="600" height="375" rx="14"/></clipPath>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".08"/></pattern>
<radialGradient id="dm" cx=".5" cy=".5" r=".55"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="dmask"><rect width="600" height="375" fill="url(#dm)"/></mask>
<radialGradient id="glow" cx=".5" cy=".6" r=".5"><stop offset="0" stop-color="#C6F24E" stop-opacity=".12"/><stop offset="1" stop-color="#C6F24E" stop-opacity="0"/></radialGradient>
<g clip-path="url(#cc)">
<rect width="600" height="375" fill="#151518"/>
<rect width="600" height="375" fill="url(#dots)" mask="url(#dmask)"/>
<rect width="600" height="375" fill="url(#glow)"/>
<g transform="translate(160 47.5) scale(2.8)">
<clipPath id="bowl"><path d="M19 24H81L50 58Z"/></clipPath>
<path class="s pour" d="M50 2V40" stroke="#C6F24E" stroke-width="2"/>
<g clip-path="url(#bowl)"><g class="liq"><rect x="0" y="22" width="100" height="60" fill="#C6F24E" fill-opacity=".18"/>
<path class="s wave" d="M-40 22Q-30 18 -20 22T0 22T20 22T40 22T60 22T80 22T100 22T120 22" stroke="#C6F24E" stroke-width="1.4"/></g>
<circle class="s bub b1" cx="42" cy="56" r="1.4" stroke="#EDEDE8" stroke-width=".8"/><circle class="s bub b2" cx="52" cy="56" r="1.4" stroke="#EDEDE8" stroke-width=".8"/><circle class="s bub b3" cx="58" cy="56" r="1.4" stroke="#EDEDE8" stroke-width=".8"/></g>
<path class="s" d="M19 24H81L50 58Z" stroke="#EDEDE8" stroke-width="1.6"/>
<path class="s" d="M50 58V84M36 86H64" stroke="#EDEDE8" stroke-width="1.6"/>
<g class="olive"><path class="s" d="M70 10L58 36" stroke="#47474f" stroke-width="1.2"/><circle class="s" cx="61" cy="30" r="4" stroke="#C6F24E" stroke-width="1.4"/></g>
<path class="s t sp sp1" d="M14 10L14 18M10 14L18 14" stroke="#EDEDE8" stroke-width="1.2"/>
<path class="s t sp sp2" d="M88 36L88 44M84 40L92 40" stroke="#EDEDE8" stroke-width="1.2"/>
<path class="s t sp sp3" d="M22 62L22 70M18 66L26 66" stroke="#EDEDE8" stroke-width="1.2"/></g>
</g>
<rect x=".5" y=".5" width="599" height="374" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>