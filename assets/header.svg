<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Jorge Vargas — Software Engineer</title>
  <desc id="d">Software Engineer based in Bilbao. I build interfaces, systems, products, with AI.</desc>

  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="20"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d1d21" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: 'Space Grotesk', 'Inter', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .w { opacity: 0; animation: show 12s steps(1) infinite; }
    .w1 { animation-delay: 0s; } .w2 { animation-delay: 3s; }
    .w3 { animation-delay: 6s; } .w4 { animation-delay: 9s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes show { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .w { animation: none; } .w1 { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="#151518"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- top bar -->
    <line x1="0" y1="64" x2="1200" y2="64" stroke="#2b2b31"/>
    <text x="56" y="39" class="mono" font-size="14" letter-spacing="2" fill="#8f8f96">JV — ENGINEER'S INDEX</text>
    <circle class="pulse" cx="900" cy="35" r="5" fill="#c6f24e"/>
    <text x="916" y="40" class="mono" font-size="14" letter-spacing="1" fill="#a6a6ad">Open to opportunities</text>

    <!-- name -->
    <text x="52" y="188" class="sans" font-size="104" font-weight="700" letter-spacing="-3" fill="#ededE8">Jorge Vargas</text>
    <text x="52" y="282" class="sans" font-size="104" font-weight="700" letter-spacing="-3" fill="none" stroke="#ededE8" stroke-width="1.2">Software Engineer</text>

    <!-- statement -->
    <line x1="0" y1="326" x2="1200" y2="326" stroke="#2b2b31"/>
    <text x="56" y="365" class="mono" font-size="20" fill="#8f8f96">I build</text>
    <g class="mono" font-size="20" fill="#ededE8">
      <text class="w w1" x="148" y="365">interfaces.</text>
      <text class="w w2" x="148" y="365">systems.</text>
      <text class="w w3" x="148" y="365">products.</text>
      <text class="w w4" x="148" y="365">with AI.</text>
    </g>
    <rect class="blink" x="290" y="348" width="10" height="21" fill="#c6f24e"/>
    <text x="1144" y="365" class="mono" font-size="14" text-anchor="end" fill="#8f8f96">Bilbao, ES · 43.26°N — 2.93°W</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="20" fill="none" stroke="#2b2b31"/>
</svg>
